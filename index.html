<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro RPS Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="glass-panel">
            <h1 class="title">ROCK PAPER SCISSORS</h1>
            
            <div class="score-board">
                <div class="stat">
                    <span class="label">HUMAN</span>
                    <span id="humanScore" class="value">0</span>
                </div>
                <div class="stat">
                    <span class="label">ROUND</span>
                    <span id="roundCount" class="value highlight">0</span>
                </div>
                <div class="stat">
                    <span class="label">CPU</span>
                    <span id="computerScore" class="value">0</span>
                </div>
            </div>

            <div class="screen">
                <div id="statusText" class="message">READY TO PLAY?</div>
            </div>

            <div class="controls">
                <button class="choice-btn" data-choice="rock">ROCK</button>
                <button class="choice-btn" data-choice="paper">PAPER</button>
                <button class="choice-btn" data-choice="scissors">SCISSORS</button>
            </div>

            <button id="resetBtn" class="reset-link">RESTART SYSTEM</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
